services:
  adventurebot:
    image: techblog/adventurebot:latest
    container_name: adventurebot
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      AL_URL: ${AL_URL}
      AL_API_KEY: ${AL_API_KEY}
      ALLOWED_IDS: ${ALLOWED_IDS:-}
    volumes:
      - ./data:/app/data
